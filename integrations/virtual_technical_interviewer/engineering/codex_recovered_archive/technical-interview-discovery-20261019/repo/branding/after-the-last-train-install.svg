<text x="132" y="143">从 GitHub 下载并解压《雨夜回环》</text>
<text x="132" y="234">使用 Finder 移入 Applications</text>
<text x="132" y="325">必要时通过 Privacy &amp; Security → Open Anyway 授权</text>
<text x="132" y="409">启动 Witness Loop，进入云江站</text>
