  <rect width="238" height="168" rx="15" fill="#1c2b36" stroke="#47606a"/>
  <text x="18" y="38" font-size="12" letter-spacing="2" fill="#d5ad78">01 / THE INVITATION</text>
  <path d="M100 61 v45 m-18-18 18 18 18-18 M75 115 h50" stroke="#edcf9d" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="119" y="144" text-anchor="middle" fill="#f5e9d9" font-size="18">Download</text>
 </g>
 <g transform="translate(340 115)">
  <rect width="238" height="168" rx="15" fill="#1c2b36" stroke="#47606a"/>
  <text x="18" y="38" font-size="12" letter-spacing="2" fill="#d5ad78">02 / FIND THE PLATFORM</text>
  <path d="M76 80 h23 l11 11 h43 v31 h-77 z" stroke="#edcf9d" stroke-width="4" stroke-linejoin="round" fill="none"/>
  <text x="119" y="144" text-anchor="middle" fill="#f5e9d9" font-size="18">Move to Applications</text>
 </g>
 <g transform="translate(630 115)">
  <rect width="238" height="168" rx="15" fill="#1c2b36" stroke="#47606a"/>
  <text x="18" y="38" font-size="12" letter-spacing="2" fill="#d5ad78">03 / CROSS THE GATE</text>
  <path d="M119 60 l36 13 v21 c0 24-20 37-36 44-16-7-36-20-36-44 V73z" stroke="#edcf9d" stroke-width="4" fill="none"/>
  <path d="M103 99 l11 10 22-24" stroke="#edcf9d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="119" y="144" text-anchor="middle" fill="#f5e9d9" font-size="18">Open Anyway</text>
 </g>
 <g transform="translate(920 115)">
  <rect width="230" height="168" rx="15" fill="#1c2b36" stroke="#47606a"/>
  <text x="18" y="38" font-size="12" letter-spacing="2" fill="#d5ad78">04 / THE FIRST CLUE</text>
  <circle cx="115" cy="93" r="32" stroke="#edcf9d" stroke-width="4" fill="none"/>
