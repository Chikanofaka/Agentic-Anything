<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370">
<title>雨夜回环 — Four steps to enter Yunjiang Station</title>
<desc>Download the game, move it using Finder to Applications, approve the unsigned beta using macOS Privacy and Security, then enter the station.</desc>
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a131d"/><stop offset="1" stop-color="#1b2836"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#e7be7b"/><stop offset="1" stop-color="#c78a50"/></linearGradient>
</defs>
<rect width="1200" height="370" rx="24" fill="url(#night)"/>
<path d="M0 285 L1200 285" stroke="#c7a077" stroke-opacity=".25"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#f2e9dc">
 <text x="52" y="58" font-size="29" font-weight="bold">AFTER THE LAST TRAIN</text>
 <text x="52" y="86" font-size="15" letter-spacing="3" fill="#c9a982">A FIELD GUIDE TO THE RAIN-SOAKED STATION</text>
</g>
<g fill="none" stroke="#bd9e7e" stroke-width="1.5" opacity=".55"><path d="M295 210 H325 M585 210 H615 M875 210 H905"/><path d="M319 204 L326 210 L319 216 M609 204 L616 210 L609 216 M899 204 L906 210 L899 216"/></g>
<g font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif">
